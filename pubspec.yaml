name: stripe_client
description: >-
  Pure Dart client for the Stripe API: typed resources, webhook signature
  verification, automatic retries and idempotency keys. Runs on Dart servers,
  CLIs and Flutter apps.
version: 0.1.0
repository: https://github.com/Fullphysio/stripe_client
issue_tracker: https://github.com/Fullphysio/stripe_client/issues

topics:
  - stripe
  - payments
  - billing
  - api

environment:
  sdk: ^3.6.0

dependencies:
  crypto: ^3.0.6
  http: ^1.6.0
  meta: ^1.16.0

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.0
  yaml: ^3.1.3
